  services:
    solr:
      image: solr:9
      container_name: pri_solr
      ports:
        - "8983:8983"
      command: solr-precreate drugs

    solr-setup:
      image: curlimages/curl:latest
      container_name: solr_setup_run
      depends_on:
        - solr
      volumes:
        - ./fields.json:/fields.json
        - ./copy_fields.json:/copy_fields.json
        - ./analysis.json:/analysis.json
        - ./data.json:/data.json
        - ./setup.sh:/setup.sh
      entrypoint: ["/bin/sh", "/setup.sh"]
